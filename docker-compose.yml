# Local development database: Postgres 16 with PostGIS.
# Production uses a hosted Postgres (Neon or Supabase) through DATABASE_URL.
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: glowy-homes-db
    environment:
      POSTGRES_USER: glowy
      POSTGRES_PASSWORD: glowy
      POSTGRES_DB: glowy
    ports:
      - "5433:5432"
    volumes:
      - glowy_homes_pg:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=16MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glowy -d glowy"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  glowy_homes_pg:
